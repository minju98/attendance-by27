<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출석 관리</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FDFBF7; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { text-align: center; }
    .qr-box { background: white; border-radius: 16px; padding: 30px; text-align: center; margin-bottom: 20px; }
    #qr { width: 360px; height: 360px; }
    .controls { margin: 20px 0; }
    input, button { padding: 10px 16px; margin: 4px; border-radius: 8px; border: 1px solid #ddd; }
    button { background: #6B5B4F; color: white; border: none; cursor: pointer; }
    .stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 120px; background: white; padding: 16px; border-radius: 12px; text-align: center; }
    table { width: 100%; background: white; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #F5F0E6; }
    #msg { color: #A65D57; margin: 10px 0; min-height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>출석 관리</h1>
    <div class="qr-box">
      <img id="qr" alt="QR">
      <p>휴대폰 카메라로 QR코드를 스캔해 주세요</p>
      <div class="controls">
        <input id="title" placeholder="행사 제목">
        <input id="expected" type="number" placeholder="예정 인원" style="width:80px">
        <button onclick="save()">저장</button>
        <button onclick="start()">출석 시작</button>
        <button onclick="end()" style="background:#A65D57">출석 종료</button>
        <button onclick="exportCSV()">CSV 다운로드</button>
      </div>
      <div id="msg"></div>
    </div>
    <div class="stats">
      <div class="stat">예정<br><strong id="exp">0</strong></div>
      <div class="stat">출석<br><strong id="pre">0</strong></div>
      <div class="stat">미출석<br><strong id="abs">0</strong></div>
      <div class="stat">출석률<br><strong id="rate">0%</strong></div>
    </div>
    <table>
      <thead><tr><th>#</th><th>소속 팀</th><th>이름</th><th>출석 시간</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
  <script>
    const PIN = '2026';
    let initialized = false;

    function showMsg(text) {
      const el = document.getElementById('msg');
      el.textContent = text;
      setTimeout(() => el.textContent = '', 3000);
    }

    async function load() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('exp').textContent = data.stats.expected;
        document.getElementById('pre').textContent = data.stats.present;
        document.getElementById('abs').textContent = data.stats.absent;
        document.getElementById('rate').textContent = data.stats.rate + '%';

        // 처음 한 번만 입력칸을 채움 (이후에는 사용자가 수정 중일 수 있으므로 덮어쓰지 않음)
        if (!initialized) {
          document.getElementById('title').value = data.session.title || '사내 교육 출석';
          document.getElementById('expected').value = data.session.expected_count || 0;
          initialized = true;
        }

        document.getElementById('list').innerHTML = data.attendees.map((a, i) => `
          <tr>
            <td>${i+1}</td><td>${a.team}</td><td>${a.name}</td>
            <td>${new Date(a.attended_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</td>
            <td><button onclick="del(${a.id})">삭제</button></td>
          </tr>`).join('');
      } catch (e) {
        showMsg('데이터를 불러오지 못했습니다');
      }
    }

    async function qr() {
      try {
        const res = await fetch('/api/qr');
        const data = await res.json();
        document.getElementById('qr').src = data.qr;
      } catch {}
    }

    async function start() { await act('start'); }
    async function end() { await act('end'); }
    async function save() { await act('save'); }

    async function act(action) {
      try {
        const res = await fetch('/api/session', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            pin: PIN,
            action,
            title: document.getElementById('title').value,
            expected: document.getElementById('expected').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          showMsg(action === 'start' ? '출석을 시작했습니다' : action === 'end' ? '출석을 종료했습니다' : '저장했습니다');
          load();
        } else {
          showMsg(data.error || '오류가 발생했습니다');
        }
      } catch {
        showMsg('서버와 통신하지 못했습니다');
      }
    }

    async function del(id) {
      if (!confirm('삭제하시겠습니까?')) return;
      await fetch(`/api/attendance/${id}`, {
        method: 'DELETE',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({pin: PIN})
      });
      load();
    }

    function exportCSV() {
      window.location = `/api/export?pin=${PIN}`;
    }

    qr();
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출석 관리</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FDFBF7; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1, h2 { text-align: center; }
    .qr-box { background: white; border-radius: 16px; padding: 30px; text-align: center; margin-bottom: 20px; }
    #qr { width: 340px; height: 340px; }
    .controls { margin: 16px 0; }
    input, button { padding: 10px 14px; margin: 4px; border-radius: 8px; border: 1px solid #ddd; }
    button { background: #6B5B4F; color: white; border: none; cursor: pointer; }
    .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 140px; background: white; padding: 16px; border-radius: 12px; text-align: center; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; justify-content: center; }
    .tabs button { background: #eee; color: #333; }
    .tabs button.active { background: #6B5B4F; color: white; }
    table { width: 100%; background: white; border-collapse: collapse; margin-bottom: 30px; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
    th { background: #F5F0E6; }
    #msg { color: #A65D57; margin: 8px 0; min-height: 20px; }
    .absent { color: #A65D57; }
  </style>
</head>
<body>
  <div class="container">
    <h1>출석 관리</h1>
    <div class="qr-box">
      <img id="qr" alt="QR">
      <p>휴대폰 카메라로 QR코드를 스캔해 주세요</p>
      <div class="controls">
        <input id="title" placeholder="행사 제목" style="width:220px">
        <button onclick="save()">제목 저장</button>
        <button onclick="start()">출석 시작</button>
        <button onclick="end()" style="background:#A65D57">출석 종료</button>
      </div>
      <div id="msg"></div>
    </div>

    <div class="stats">
      <div class="stat">예상 인원<br><strong id="exp">0</strong></div>
      <div class="stat">출석 완료<br><strong id="matched">0</strong></div>
      <div class="stat">미출석<br><strong id="abs">0</strong></div>
      <div class="stat">출석률<br><strong id="rate">0%</strong></div>
    </div>

    <div class="tabs">
      <button id="tab-present" class="active" onclick="showTab('present')">출석자</button>
      <button id="tab-absent" onclick="showTab('absent')">미출석자 명단</button>
    </div>

    <div id="present-section">
      <h2>출석자 목록</h2>
      <table>
        <thead><tr><th>#</th><th>이름</th><th>입력한 팀</th><th>명단 부서</th><th>시간</th><th>매칭</th></tr></thead>
        <tbody id="present-list"></tbody>
      </table>
    </div>

    <div id="absent-section" style="display:none">
      <h2>아직 출석하지 않은 사람</h2>
      <table>
        <thead><tr><th>회사</th><th>소속부서</th><th>성명</th><th>사번</th><th></th></tr></thead>
        <tbody id="absent-list"></tbody>
      </table>
    </div>
  </div>

  <script>
    const PIN = '2026';
    let initialized = false;

    function showMsg(text) {
      const el = document.getElementById('msg');
      el.textContent = text;
      setTimeout(() => el.textContent = '', 3000);
    }

    function showTab(tab) {
      document.getElementById('present-section').style.display = tab === 'present' ? 'block' : 'none';
      document.getElementById('absent-section').style.display = tab === 'absent' ? 'block' : 'none';
      document.getElementById('tab-present').classList.toggle('active', tab === 'present');
      document.getElementById('tab-absent').classList.toggle('active', tab === 'absent');
    }

    async function load() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        document.getElementById('exp').textContent = data.expectedTotal;
        document.getElementById('matched').textContent = data.matchedCount;
        document.getElementById('abs').textContent = data.absentCount;
        document.getElementById('rate').textContent = data.rate + '%';

        if (!initialized) {
          document.getElementById('title').value = data.session.title || '사내 교육 출석';
          initialized = true;
        }

        document.getElementById('present-list').innerHTML = data.present.map((a, i) => `
          <tr>
            <td>${i+1}</td>
            <td>${a.name}</td>
            <td>${a.team}</td>
            <td>${a.dept || '-'}</td>
            <td>${new Date(a.attended_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</td>
            <td>${a.matched ? '✓' : '명단없음'}</td>
          </tr>`).join('');

        document.getElementById('absent-list').innerHTML = data.absent.map(e => `
          <tr>
            <td>${e.company}</td>
            <td>${e.dept}</td>
            <td>${e.name}</td>
            <td>${e.empId}</td>
            <td><button onclick="manual('${e.empId}','checkin')">수동 출석</button></td>
          </tr>`).join('');
      } catch (e) {
        showMsg('데이터를 불러오지 못했습니다');
      }
    }

    async function qr() {
      try {
        const res = await fetch('/api/qr');
        const data = await res.json();
        document.getElementById('qr').src = data.qr;
      } catch {}
    }

    async function start() { await act('start'); }
    async function end() { await act('end'); }
    async function save() { await act('save'); }

    async function act(action) {
      try {
        const res = await fetch('/api/session', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            pin: PIN,
            action,
            title: document.getElementById('title').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          showMsg(action === 'start' ? '출석을 시작했습니다' : action === 'end' ? '출석을 종료했습니다' : '저장했습니다');
          load();
        } else {
          showMsg(data.error || '오류가 발생했습니다');
        }
      } catch {
        showMsg('서버와 통신하지 못했습니다');
      }
    }

    async function manual(empId, action) {
      if (action === 'checkin' && !confirm('이 사람을 수동으로 출석 처리하시겠습니까?')) return;
      await fetch('/api/manual', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ pin: PIN, empId, action })
      });
      load();
    }

    qr();
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
